<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API Request Status</title>
</head>
<body>
    <h2>Test cập nhật trạng thái yêu cầu</h2>
    
    <label>ID yêu cầu:</label>
    <input type="number" id="requestId" placeholder="Nhập ID">
    
    <label>Chọn trạng thái:</label>
    <select id="statusSelect">
        <option value="APPROVED">APPROVED</option>
        <option value="REJECTED">REJECTED</option>
        <option value="RETURNED">RETURNED</option>
    </select>
    
    <button onclick="updateStatus()">Cập nhật</button>

    <pre id="response" style="background:#f4f4f4; padding:10px; margin-top:20px;"></pre>

    <script>
        async function updateStatus() {
            const id = document.getElementById('requestId').value;
            const status = document.getElementById('statusSelect').value;
            const resDiv = document.getElementById('response');

            try {
                const response = await fetch(`http://localhost:8080/api/requests/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });

                const data = await response.json();
                resDiv.innerText = response.ok ? 
                    "Thành công: " + JSON.stringify(data, null, 2) : 
                    "Lỗi: " + JSON.stringify(data, null, 2);
            } catch (error) {
                resDiv.innerText = "Lỗi kết nối: " + error.message;
            }
        }
    </script>
</body>
</html>
