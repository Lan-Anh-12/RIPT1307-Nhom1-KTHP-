<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API Thiết bị</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .row { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .row input { display: block; margin: 5px 0; padding: 8px; width: 300px; }
        button { padding: 10px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
        button:hover { background: #218838; }
        pre { background: #333; color: #fff; padding: 15px; overflow-x: auto; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="box">
        <h2>1. Đăng nhập</h2>
        <input id="loginEmail" value="tranlananh12bpt@gmail.com" placeholder="Email">
        <input id="loginPass" type="password" value="123456" placeholder="Mật khẩu">
        <button onclick="login()">Đăng nhập</button>
        <p id="loginStatus"></p>
    </div>

    <div class="box">
        <h2>2. Các API Thiết bị</h2>
        <div class="row">
            <button onclick="callApi('GET', '/api/devices', null)">Lấy danh sách thiết bị</button>
        </div>

        <div class="row">
            <h4>Tạo mới (Admin)</h4>
            <input id="cName" placeholder="Tên thiết bị">
            <input id="cImg" placeholder="Link ảnh">
            <input id="cQty" type="number" placeholder="Số lượng">
            <input id="cDesc" placeholder="Mô tả">
            <input id="cCat" type="number" placeholder="Category ID">
            <button onclick="createDevice()">Gửi yêu cầu tạo</button>
        </div>

        <div class="row">
            <h4>Cập nhật (Admin)</h4>
            <input id="uId" placeholder="ID thiết bị">
            <input id="uName" placeholder="Tên mới">
            <input id="uImg" placeholder="Link ảnh mới">
            <input id="uQty" type="number" placeholder="Số lượng mới">
            <input id="uDesc" placeholder="Mô tả mới">
            <input id="uCat" type="number" placeholder="Category ID mới">
            <button onclick="updateDevice()">Gửi yêu cầu sửa</button>
        </div>

        <div class="row">
            <h4>Xóa (Admin)</h4>
            <input id="dId" placeholder="ID thiết bị cần xóa">
            <button onclick="deleteDevice()">Xác nhận xóa</button>
        </div>
    </div>

    <div class="box">
        <h3>Kết quả:</h3>
        <pre id="result">Kết quả sẽ hiện ở đây...</pre>
    </div>

    <script>
        const BASE_URL = "http://localhost:8080";

        async function login() {
            const res = await fetch(`${BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: document.getElementById('loginEmail').value, 
                    password: document.getElementById('loginPass').value 
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem("token", data.token);
                document.getElementById('loginStatus').innerText = "Chào " + data.name + " (Role: " + data.role + ")";
                alert("Đăng nhập thành công!");
            } else {
                alert("Lỗi: " + data.message);
            }
        }

        async function callApi(method, path, body) {
            const res = await fetch(`${BASE_URL}${path}`, {
                method: method,
                headers: { 
                    'Authorization': 'Bearer ' + localStorage.getItem("token"), 
                    'Content-Type': 'application/json' 
                },
                body: body ? JSON.stringify(body) : null
            });
            
            const text = await res.text();
            let displayData;
            try {
                displayData = JSON.stringify(JSON.parse(text), null, 2);
            } catch (e) {
                displayData = text; // Nếu không phải JSON thì hiện text
            }
            document.getElementById('result').innerText = `Status: ${res.status}\n\n${displayData}`;
        }

        function createDevice() {
            callApi('POST', '/api/devices/create', {
                name: document.getElementById('cName').value,
                imageUrl: document.getElementById('cImg').value,
                quantity: parseInt(document.getElementById('cQty').value) || 0,
                description: document.getElementById('cDesc').value,
                categoryId: parseInt(document.getElementById('cCat').value)
            });
        }

        function updateDevice() {
            const id = document.getElementById('uId').value;
            callApi('PUT', '/api/devices/' + id, {
                name: document.getElementById('uName').value,
                imageUrl: document.getElementById('uImg').value,
                quantity: parseInt(document.getElementById('uQty').value) || 0,
                description: document.getElementById('uDesc').value,
                categoryId: parseInt(document.getElementById('uCat').value)
            });
        }

        function deleteDevice() {
            const id = document.getElementById('dId').value;
            callApi('DELETE', '/api/devices/' + id, null);
        }
    </script>
</body>
</html>
