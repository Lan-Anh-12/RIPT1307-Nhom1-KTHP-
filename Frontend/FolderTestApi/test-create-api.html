<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API Create Request</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, select, button { padding: 10px; width: 100%; max-width: 300px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        pre { background: #eee; padding: 10px; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Test API: Gửi yêu cầu mượn thiết bị</h2>
    
    <div class="form-group">
        <label>User ID:</label>
        <input type="number" id="userId" placeholder="Nhập ID User (VD: 1)">
    </div>
    <div class="form-group">
        <label>Thiết bị:</label>
        <select id="deviceItemId">
            <option value="1">Laptop Dell Latitude 5440 i5</option>
            <option value="2">Router Cisco ISR 4331</option>
        </select>
    </div>
    <div class="form-group">
        <label>Số lượng:</label>
        <input type="number" id="quantity" value="1">
    </div>
    <div class="form-group">
        <label>Ngày mượn:</label>
        <input type="date" id="requestDate">
    </div>
    <div class="form-group">
        <label>Ngày trả dự kiến:</label>
        <input type="date" id="expectedReturnDate">
    </div>

    <button onclick="sendRequest()">Gửi yêu cầu mượn</button>

    <h3>Kết quả:</h3>
    <pre id="response">Chờ kết quả...</pre>

    <script>
        function sendRequest() {
            const data = {
                id: parseInt(document.getElementById('userId').value),
                deviceItemId: parseInt(document.getElementById('deviceItemId').value),
                quantity: parseInt(document.getElementById('quantity').value),
                requestDate: document.getElementById('requestDate').value,
                expectedReturnDate: document.getElementById('expectedReturnDate').value
            };

            fetch('http://localhost:8080/api/requests/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById('response').innerText = JSON.stringify(result, null, 2);
            })
            .catch(error => {
                document.getElementById('response').innerText = "Lỗi: " + error.message;
            });
        }
    </script>
</body>
</html>
