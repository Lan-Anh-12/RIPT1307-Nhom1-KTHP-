<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test API Thông báo Full</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .row { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        button { padding: 8px 12px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        input { padding: 8px; width: 200px; }
        pre { background: #333; color: #fff; padding: 15px; border-radius: 5px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="box">
        <h2>1. Đăng nhập</h2>
        <input id="email" value="tranlananh12bpt@gmail.com" placeholder="Email">
        <input id="pass" type="password" value="123456" placeholder="Mật khẩu">
        <button onclick="login()">Đăng nhập</button>
    </div>

    <div class="box">
        <h2>2. API Thông báo</h2>
        

        <div class="row">
            <h4>Xem thông báo theo User ID </h4>
            <input id="targetUserId" placeholder="Nhập User ID">
            <button onclick="callApi('GET', '/api/notifications/user/' + document.getElementById('targetUserId').value)">Lấy theo ID</button>
        </div>

        <div class="row">
            <h4>Đánh dấu đã đọc</h4>
            <input id="notifId" placeholder="Nhập ID thông báo">
            <button onclick="callApi('PUT', '/api/notifications/' + document.getElementById('notifId').value + '/read')">Đánh dấu đã đọc</button>
        </div>
    </div>

    <div class="box">
        <h3>Kết quả trả về:</h3>
        <pre id="result">Chờ thực hiện lệnh...</pre>
    </div>

    <script>
        const BASE_URL = "http://localhost:8080";

        async function login() {
            const res = await fetch(`${BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: document.getElementById('email').value, 
                    password: document.getElementById('pass').value 
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                // Lưu tất cả thông tin vào localStorage để dùng cho các API sau
                localStorage.setItem("token", data.token);
                localStorage.setItem("userId", data.userId);
                localStorage.setItem("name", data.name);
                localStorage.setItem("role", data.role);
                
                document.getElementById('result').innerText = 
                    `Đăng nhập thành công!\n` +
                    `Chào: ${data.name}\n` +
                    `ID: ${data.userId}\n` +
                    `Role: ${data.role}\n\n` +
                    `Token đã được lưu vào localStorage.`;
            } else {
                document.getElementById('result').innerText = "Lỗi login: " + (data.message || "Không xác định");
            }
        }

        async function callApi(method, path) {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("Vui lòng đăng nhập trước!");
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}${path}`, {
                    method: method,
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json' 
                    }
                });
                
                const text = await response.text();
                // Kiểm tra nếu là JSON thì format, không thì để nguyên
                let displayData;
                try {
                    displayData = JSON.stringify(JSON.parse(text), null, 2);
                } catch (e) {
                    displayData = text;
                }
                
                document.getElementById('result').innerText = `Status: ${response.status}\n\n${displayData}`;
            } catch (e) {
                document.getElementById('result').innerText = "Lỗi kết nối: " + e.message;
            }
        }
    </script>
</body>
</html>
